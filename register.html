<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Registration | Alumni Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <h1>Alumni Management System</h1>
        <p>Join Our Alumni Network</p>
    </header>

    <nav class="navbar">
        <div class="logo">AlumniConnect</div>
        <ul class="nav-links">
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="alumni.html">Alumni</a></li>
            <li><a href="#">Events</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="#">Logout</a></li>
        </ul>
    </nav>

    <main>

        <section class="form-container card-surface">
            <h1>Alumni Registration</h1>

            <form>
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com">

                <label for="batch">Batch</label>
                <input type="number" id="batch" name="batch" placeholder="e.g. 2024">

                <label for="department">Department</label>
                <select id="department" name="department">
                    <option>Computer Science</option>
                    <option>Software Engineering</option>
                    <option>Information Technology</option>
                </select>

                <label for="organization">Current Organization</label>
                <input type="text" id="organization" name="organization" placeholder="Company / Organization name">

                <button type="submit">Register</button>
            </form>
        </section>

    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Alumni Management System. All Rights Reserved.</p>
    </footer>

</body>
</html>
